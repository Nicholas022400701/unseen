name: Assemble release
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run build
      - name: Commit reproducible standalone bundle
        run: |
          git config user.name "区梓灏"
          git config user.email "116372750+Nicholas022400701@users.noreply.github.com"
          test "$(git hash-object dist/index.html)" = "3d5c839644579ce7778dbbfc7c2c6924b47513f9"
          git add dist/index.html
          git diff --cached --quiet || git commit -m "Build verified standalone release"
          git push
